<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="100%" height="100%">
  <defs>
    <style>
      .logica-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 88px;
        fill: #2979FF;
        letter-spacing: 0.04em;
      }
      .softworks-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 38px;
        fill: #FFFFFF;
        stroke: #2979FF;
        stroke-width: 1.8px;
        letter-spacing: 0.26em;
      }
      .softworks-title-light {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 38px;
        fill: #1E293B;
        stroke: #2979FF;
        stroke-width: 1.2px;
        letter-spacing: 0.26em;
      }
    </style>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(15, 15) scale(1.5)">
    <!-- Neon green rounded square outline with dialogue / ribbon fold -->
    <path
      d="M 14 62 L 14 24 A 12 12 0 0 1 26 12 L 74 12 A 12 12 0 0 1 86 24 L 86 74 A 12 12 0 0 1 74 86 L 28 86 L 8 86 L 22 72"
      fill="none"
      stroke="#00E575"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Text Lockup -->
  <!-- "LOGICA" -->
  <text x="180" y="90" class="logica-title">LOGICA</text>

  <!-- "SOFTWORKS" -->
  <text x="184" y="142" class="softworks-title">SOFTWORKS</text>
</svg>
